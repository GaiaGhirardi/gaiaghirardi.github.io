# Each group becomes a heading, in this order, on the page named in "page":
#   page: work-in-progress   the Work in progress page
#   page: publications       the Publications page
# To move a paper (for example once it is published), cut its entry and
# paste it under another group.
# Only "title" is required. Leave out any field a paper doesn't have.
#
#   - title: Paper title
#     authors:                      (in order; your name, as written in
#       - G. Ghirardi                citation_name in _config.yml, is bold)
#       - F. Bernardi
#     status: Journal Name (2026)
#     abstract: >-
#       Abstract text, on as many lines as you like.
#     links:
#       - label: paper
#         url: https://doi.org/...
#       - label: replication
#         url: https://github.com/GaiaGhirardi/...
#
# A coauthor can also link to their website:
#       - name: F. Bernardi
#         url: https://their-website.com

